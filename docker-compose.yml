version: '3.8'

services:
  backend:
    build: .
    image: ai-research-simplifier-backend
    container_name: research-simplifier-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./temp_uploads:/app/temp_uploads
    command: python -m uvicorn app.main:app --host 0.0.0.0 --port 8000
    restart: unless-stopped

volumes:
  temp_uploads:
